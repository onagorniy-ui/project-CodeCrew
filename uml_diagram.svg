<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    
    <!-- Arrow Marker (Inheritance) -->
    <marker id="arrow-inherit" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    
    <!-- Diamond Marker (Composition/Aggregation) -->
    <marker id="diamond-comp" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 6 0 L 12 6 L 6 12 L 0 6 z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-note" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 6 0 L 12 6 L 6 12 L 0 6 z" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">NORA — Архітектура класів (UML Class Diagram)</text>

  <!-- ================= USERDICT ================= -->
  <g filter="url(#shadow)" transform="translate(390, 60)">
    <rect width="220" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">&lt;&lt;collections.UserDict&gt;&gt;</text>
    <text x="110" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">UserDict</text>
    <line x1="0" y1="42" x2="220" y2="42" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="52" font-size="10" fill="#334155">+ data: dict</text>
  </g>

  <!-- ================= ADDRESSBOOK ================= -->
  <g filter="url(#shadow)" transform="translate(140, 160)">
    <rect width="320" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="160" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#0369a1">AddressBook</text>
    <line x1="0" y1="34" x2="320" y2="34" stroke="#bae6fd" stroke-width="1"/>
    <text x="14" y="50" font-size="12" fill="#0369a1">+ data: dict[str, Record]</text>
    <line x1="0" y1="60" x2="320" y2="60" stroke="#bae6fd" stroke-width="1"/>
    <text x="14" y="78" font-size="11.5" fill="#0369a1">+ add_record(record: Record): None</text>
    <text x="14" y="96" font-size="11.5" fill="#0369a1">+ find(name: str): Record | None</text>
    <text x="14" y="114" font-size="11.5" fill="#0369a1">+ delete(name: str): None</text>
    <text x="14" y="132" font-size="11.5" fill="#0369a1">+ search(query: str): list[Record]</text>
    <text x="14" y="150" font-size="11.5" fill="#0369a1">+ get_upcoming_birthdays(days: int): list</text>
  </g>

  <!-- ================= NOTEBOOK ================= -->
  <g filter="url(#shadow)" transform="translate(560, 160)">
    <rect width="310" height="160" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="155" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">NoteBook</text>
    <line x1="0" y1="34" x2="310" y2="34" stroke="#fde68a" stroke-width="1"/>
    <text x="14" y="50" font-size="12" fill="#92400e">+ data: dict[str, Note]</text>
    <line x1="0" y1="60" x2="310" y2="60" stroke="#fde68a" stroke-width="1"/>
    <text x="14" y="78" font-size="11.5" fill="#92400e">+ add_note(note: Note): None</text>
    <text x="14" y="96" font-size="11.5" fill="#92400e">+ find_note(keyword: str): list[Note]</text>
    <text x="14" y="114" font-size="11.5" fill="#92400e">+ search_by_tag(tag: str): list[Note]</text>
    <text x="14" y="132" font-size="11.5" fill="#92400e">+ sort_by_tag(): list[Note]</text>
    <text x="14" y="150" font-size="11.5" fill="#92400e">+ edit_note(title: str, text: str): None</text>
    <text x="14" y="168" font-size="11.5" fill="#92400e">+ delete_note(title: str): None</text>
  </g>

  <!-- Inheritance lines to UserDict -->
  <path d="M 300 160 L 300 135 L 450 135 L 450 115" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-inherit)"/>
  <path d="M 715 160 L 715 135 L 550 135 L 550 115" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-inherit)"/>

  <!-- ================= RECORD ================= -->
  <g filter="url(#shadow)" transform="translate(140, 360)">
    <rect width="320" height="230" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="160" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Record</text>
    <line x1="0" y1="34" x2="320" y2="34" stroke="#bbf7d0" stroke-width="1"/>
    <text x="14" y="50" font-size="11.5" fill="#166534">+ name: Name</text>
    <text x="14" y="66" font-size="11.5" fill="#166534">+ phones: list[Phone]</text>
    <text x="14" y="82" font-size="11.5" fill="#166534">+ email: Email | None</text>
    <text x="14" y="98" font-size="11.5" fill="#166534">+ address: Address | None</text>
    <text x="14" y="114" font-size="11.5" fill="#166534">+ birthday: Birthday | None</text>
    <line x1="0" y1="122" x2="320" y2="122" stroke="#bbf7d0" stroke-width="1"/>
    <text x="14" y="140" font-size="11.5" fill="#166534">+ add_phone(phone: str): None</text>
    <text x="14" y="156" font-size="11.5" fill="#166534">+ edit_phone(old: str, new: str): None</text>
    <text x="14" y="172" font-size="11.5" fill="#166534">+ remove_phone(phone: str): None</text>
    <text x="14" y="188" font-size="11.5" fill="#166534">+ add_birthday(bday: str): None</text>
    <text x="14" y="204" font-size="11.5" fill="#166534">+ add_email(email: str): None</text>
    <text x="14" y="220" font-size="11.5" fill="#166534">+ add_address(addr: str): None</text>
  </g>

  <!-- Composition AddressBook -> Record -->
  <path d="M 300 310 L 300 360" fill="none" stroke="#0284c7" stroke-width="2" marker-start="url(#diamond-comp)"/>

  <!-- ================= NOTE ================= -->
  <g filter="url(#shadow)" transform="translate(585, 360)">
    <rect width="260" height="150" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="130" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Note</text>
    <line x1="0" y1="34" x2="260" y2="34" stroke="#fde68a" stroke-width="1"/>
    <text x="14" y="52" font-size="12" fill="#b45309">+ title: str</text>
    <text x="14" y="70" font-size="12" fill="#b45309">+ text: str</text>
    <text x="14" y="88" font-size="12" fill="#b45309">+ tags: set[str]</text>
    <line x1="0" y1="98" x2="260" y2="98" stroke="#fde68a" stroke-width="1"/>
    <text x="14" y="116" font-size="11.5" fill="#b45309">+ add_tag(tag: str): None</text>
    <text x="14" y="134" font-size="11.5" fill="#b45309">+ remove_tag(tag: str): None</text>
  </g>

  <!-- Composition NoteBook -> Note -->
  <path d="M 715 320 L 715 360" fill="none" stroke="#d97706" stroke-width="2" marker-start="url(#diamond-note)"/>

  <!-- ================= FIELD BASE CLASS ================= -->
  <g filter="url(#shadow)" transform="translate(420, 620)">
    <rect width="160" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">Field</text>
    <line x1="0" y1="32" x2="160" y2="32" stroke="#c7d2fe" stroke-width="1"/>
    <text x="14" y="48" font-size="11.5" fill="#4338ca">+ value: any</text>
  </g>

  <!-- ================= FIELD SUBCLASSES ================= -->
  <g filter="url(#shadow)" transform="translate(30, 715)">
    <rect width="130" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="65" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Name</text>
  </g>
  <g filter="url(#shadow)" transform="translate(180, 715)">
    <rect width="150" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Phone (10 digits)</text>
  </g>
  <g filter="url(#shadow)" transform="translate(350, 715)">
    <rect width="150" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Email (@ and .)</text>
  </g>
  <g filter="url(#shadow)" transform="translate(520, 715)">
    <rect width="130" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="65" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Address</text>
  </g>
  <g filter="url(#shadow)" transform="translate(670, 715)">
    <rect width="160" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="80" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Birthday (DD.MM.YYYY)</text>
  </g>

  <!-- Subclass inheritance lines to Field -->
  <path d="M 95 715 L 95 695 L 470 695 L 470 680" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-inherit)"/>
  <path d="M 255 715 L 255 695 L 485 695 L 485 680" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-inherit)"/>
  <path d="M 425 715 L 425 695 L 500 695 L 500 680" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-inherit)"/>
  <path d="M 585 715 L 585 695 L 515 695 L 515 680" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-inherit)"/>
  <path d="M 750 715 L 750 695 L 530 695 L 530 680" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#arrow-inherit)"/>

  <!-- Record points to Field -->
  <path d="M 300 590 L 300 650 L 420 650" fill="none" stroke="#16a34a" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="310" y="642" font-size="11" fill="#166534">містить поля</text>
</svg>
